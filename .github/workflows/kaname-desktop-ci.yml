name: Kaname desktop build and core tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Sources/**"
      - "Rust/KanameCore/**"
      - "Tests/**"
      - "proto/**"
      - "Package.swift"
      - "Package.resolved"
      - "Scripts/dev.sh"
      - "Scripts/build-kaname-desktop.sh"
      - ".github/workflows/kaname-desktop-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kaname-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-core:
    name: Rust core
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && rustup default 1.97.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Rust/KanameCore/target
          key: kaname-core-${{ runner.os }}-${{ hashFiles('Rust/KanameCore/Cargo.lock') }}
      - name: Format and test
        run: |
          cargo fmt --manifest-path Rust/KanameCore/Cargo.toml --check
          cargo test --locked --manifest-path Rust/KanameCore/Cargo.toml

  swift-desktop:
    name: Swift desktop products
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Cache SwiftPM
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: kaname-swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Build every bundled product
        run: |
          for product in KanamePrototype KanameLocalControlService KanameUpdateHelper KanameConversationWorker KanameWorkflowWorker KanameWorkflowLlmHost KanameWorkflowCapabilityHost KanameWorkflowConnectorHost; do
            swift build -c debug --product "$product"
          done
      - name: Test desktop boundaries
        run: |
          swift test --filter KanameDomainTests
          swift test --filter KanameProtocolTests
          swift test --filter KanameDesktopTests
