[package]
name = "kaname-link-linux"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gtk"]

[lib]
path = "src/core_client.rs"

[[bin]]
name = "kaname-link-linux"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
gtk = { package = "gtk4", version = "=0.10.2", features = ["v4_10"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
