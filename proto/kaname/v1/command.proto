syntax = "proto3";

package kaname.v1;

import "kaname/v1/common.proto";

message CommandEnvelope {
  SchemaVersion schema_version = 1;
  string command_id = 2;
  string idempotency_key = 3;
  string kind = 4;
  OpaqueTypedPayload payload = 5;
  Scope scope = 6;
  string actor_id = 7;
  uint64 expected_revision = 8;
  int64 submitted_at_unix_millis = 9;
  reserved 10 to 31;
  reserved "provider_token", "secret";
}

enum CommandDisposition {
  COMMAND_DISPOSITION_UNSPECIFIED = 0;
  COMMAND_DISPOSITION_ACCEPTED = 1;
  COMMAND_DISPOSITION_REJECTED = 2;
  COMMAND_DISPOSITION_DUPLICATE = 3;
  COMMAND_DISPOSITION_CONFLICT = 4;
}

message CommandOutcome {
  string command_id = 1;
  CommandDisposition disposition = 2;
  string reason_code = 3;
  uint64 store_position = 4;
  string receipt_id = 5;
  reserved 6 to 15;
}
