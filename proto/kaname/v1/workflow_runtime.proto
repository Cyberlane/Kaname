syntax = "proto3";

package kaname.v1;

import "kaname/v1/common.proto";
import "kaname/v1/approval.proto";

// A value recorded directly in the bounded journal or represented by an
// opaque storage reference. Host paths and secret material are never valid
// references.
message WorkflowValueReference {
  string value_id = 1;
  string content_type = 2;
  uint64 byte_count = 3;
  string sha256 = 4;
  bytes inline_canonical_json = 5;
  string storage_reference_id = 6;
  reserved 7 to 15;
  WorkflowStorageValueMetadata storage = 16;
  reserved "host_path", "raw_path", "secret";
}

// Inspectable lineage for a scoped value. The handle is opaque and never a
// host path; byte access remains mediated by the storage service.
message WorkflowStorageValueMetadata {
  string handle_id = 1;
  string scope = 2;
  string logical_key = 3;
  string version_id = 4;
  uint64 revision = 5;
  string previous_version_id = 6;
  uint64 byte_count = 7;
  string result = 8;
  string source_version_id = 9;
  reserved 10 to 20;
  reserved "host_path", "raw_path", "cas_path", "mount_path";
}

message WorkflowInputBinding {
  string port_id = 1;
  WorkflowValueReference value = 2;
  reserved 3 to 10;
}

enum WorkflowRunRetentionMode {
  WORKFLOW_RUN_RETENTION_MODE_UNSPECIFIED = 0;
  WORKFLOW_RUN_RETENTION_MODE_DURATION = 1;
  WORKFLOW_RUN_RETENTION_MODE_DELETE_AFTER_SUCCESS = 2;
  WORKFLOW_RUN_RETENTION_MODE_FOREVER = 3;
}

// Immutable retention policy copied from the published workflow revision into
// the run-start fact. A missing workflow policy compiles to the 30-day default.
message WorkflowRunRetentionPolicy {
  WorkflowRunRetentionMode mode = 1;
  uint32 days = 2;
  reserved 3 to 10;
}

// Payload for command kind `workflow.run.request`.
message RequestWorkflowRun {
  string run_id = 1;
  string workflow_id = 2;
  string revision_id = 3;
  string package_digest = 4;
  string trigger_kind = 5;
  string trigger_event_id = 6;
  repeated WorkflowInputBinding inputs = 7;
  reserved 8 to 20;
  string installation_id = 21;
  string case_id = 22;
  string episode_id = 23;
  string episode_kind = 24;
  string prior_episode_id = 25;
  reserved 26 to 30;
  reserved "workflow_path", "database_path", "credential";
}

// Payload for command kind `workflow.run.cancel`.
message CancelWorkflowRun {
  string run_id = 1;
  string run_token_id = 2;
  string reason_code = 3;
  reserved 4 to 15;
}

message WorkflowWaitCorrelation {
  string key = 1;
  string sha256 = 2;
  reserved 3 to 10;
}

// Payload for command kind `workflow.wait.signal`.
message SignalWorkflowWait {
  string run_id = 1;
  string signal_id = 2;
  string kind = 3;
  string owner_kind = 4;
  string owner_id = 5;
  repeated WorkflowWaitCorrelation correlation = 6;
  WorkflowValueReference value = 7;
  reserved 8 to 20;
}

// Payload for event kind `workflow.run.token-created`.
message WorkflowRunTokenCreated {
  string run_id = 1;
  string run_token_id = 2;
  string request_command_id = 3;
  string workflow_id = 4;
  string revision_id = 5;
  string package_digest = 6;
  WorkflowRunRetentionPolicy retention_policy = 7;
  reserved 8 to 20;
}

// The immutable boundary between a durable case and one version-pinned run.
// Context is compiled from earlier settled episodes in journal order; it is
// never process-local conversation state and never mutates an earlier run.
message WorkflowCaseEpisodeStarted {
  string run_id = 1;
  string run_token_id = 2;
  string installation_id = 3;
  string case_id = 4;
  string episode_id = 5;
  uint32 ordinal = 6;
  string kind = 7;
  string prior_episode_id = 8;
  string workflow_id = 9;
  string revision_id = 10;
  string package_digest = 11;
  string trigger_kind = 12;
  string trigger_event_id = 13;
  repeated WorkflowInputBinding inputs = 14;
  WorkflowValueReference compiled_context = 15;
  repeated string source_episode_ids = 16;
  repeated string source_event_ids = 17;
  reserved 18 to 30;
}

// One immutable parent-to-child call. The child revision is resolved from the
// parent's published dependency lock before this fact is admitted.
message WorkflowSubflowCalled {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string attempt_id = 4;
  string execution_token_id = 5;
  string node_id = 6;
  string child_run_id = 7;
  string child_command_id = 8;
  string child_workflow_id = 9;
  string child_revision_id = 10;
  string child_package_id = 11;
  string child_package_digest = 12;
  string entrypoint = 13;
  WorkflowValueReference input = 14;
  reserved 15 to 30;
}

message WorkflowSubflowSettled {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string child_run_id = 4;
  WorkflowRunOutcome outcome = 5;
  WorkflowValueReference output = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  repeated string child_final_emission_ids = 9;
  reserved 10 to 25;
}

// One durable path through the graph. The run token pins the immutable run;
// execution tokens make fan-out, join, and cancellation replayable without
// relying on worker memory or scheduling order.
message WorkflowExecutionTokenCreated {
  string run_id = 1;
  string run_token_id = 2;
  string execution_token_id = 3;
  string parent_execution_token_id = 4;
  string fork_node_id = 5;
  string branch_id = 6;
  string branch_port_id = 7;
  string join_node_id = 8;
  string source_emission_id = 9;
  string iteration_node_id = 10;
  uint32 iteration_index = 11;
  uint32 iteration_count = 12;
  string resume_node_id = 13;
  string resume_reason = 14;
  reserved 15 to 20;
}

enum WorkflowExecutionTokenOutcome {
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_COMPLETED = 1;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_FAILED = 2;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_CANCELLED = 3;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_FORKED = 4;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_JOINED = 5;
  WORKFLOW_EXECUTION_TOKEN_OUTCOME_ITERATED = 6;
}

message WorkflowExecutionTokenSettled {
  string run_id = 1;
  string run_token_id = 2;
  string execution_token_id = 3;
  WorkflowExecutionTokenOutcome outcome = 4;
  string terminal_node_id = 5;
  string join_node_id = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  repeated string final_emission_ids = 9;
  reserved 10 to 20;
}

enum WorkflowJoinDecision {
  WORKFLOW_JOIN_DECISION_UNSPECIFIED = 0;
  WORKFLOW_JOIN_DECISION_SUCCEEDED = 1;
  WORKFLOW_JOIN_DECISION_FAILED = 2;
}

// A single immutable decision for one fork group at one join. The complete
// token partition makes all/any/quorum behavior independent of delivery and
// process timing.
message WorkflowJoinEvaluated {
  string run_id = 1;
  string run_token_id = 2;
  string join_node_id = 3;
  string fork_node_id = 4;
  string resumed_execution_token_id = 5;
  string policy = 6;
  uint32 threshold = 7;
  WorkflowJoinDecision decision = 8;
  repeated string expected_execution_token_ids = 9;
  repeated string arrived_execution_token_ids = 10;
  repeated string failed_execution_token_ids = 11;
  repeated string pending_execution_token_ids = 12;
  bool cancel_remaining = 13;
  string error_code = 14;
  reserved 15 to 25;
}

enum WorkflowIterationDecision {
  WORKFLOW_ITERATION_DECISION_UNSPECIFIED = 0;
  WORKFLOW_ITERATION_DECISION_SUCCEEDED = 1;
  WORKFLOW_ITERATION_DECISION_FAILED = 2;
}

// Immutable expansion and bounds for one for-each controller attempt. Item
// values remain visible through ordinary port emissions and edge checkpoints.
message WorkflowIterationPlanned {
  string run_id = 1;
  string run_token_id = 2;
  string iteration_node_id = 3;
  string parent_execution_token_id = 4;
  string controller_attempt_id = 5;
  string input_value_id = 6;
  string input_sha256 = 7;
  uint32 item_count = 8;
  uint32 maximum_items = 9;
  uint32 maximum_concurrency = 10;
  string failure_policy = 11;
  reserved 12 to 20;
}

// One terminal decision for an iteration. The exact token partition is
// durable, while the compact output is passed to the controller's success or
// error edge by the resumed execution token.
message WorkflowIterationEvaluated {
  string run_id = 1;
  string run_token_id = 2;
  string iteration_node_id = 3;
  string parent_execution_token_id = 4;
  string resumed_execution_token_id = 5;
  string failure_policy = 6;
  WorkflowIterationDecision decision = 7;
  repeated string expected_execution_token_ids = 8;
  repeated string succeeded_execution_token_ids = 9;
  repeated string failed_execution_token_ids = 10;
  repeated string pending_execution_token_ids = 11;
  string error_code = 12;
  WorkflowValueReference output = 13;
  reserved 14 to 25;
}

enum WorkflowRetryDecision {
  WORKFLOW_RETRY_DECISION_UNSPECIFIED = 0;
  WORKFLOW_RETRY_DECISION_SCHEDULED = 1;
  WORKFLOW_RETRY_DECISION_EXHAUSTED = 2;
  WORKFLOW_RETRY_DECISION_NOT_RETRYABLE = 3;
  WORKFLOW_RETRY_DECISION_UNKNOWN_OUTCOME = 4;
}

// The retry controller records its classification and exact deterministic
// deadline before a retry edge can be admitted.
message WorkflowRetryEvaluated {
  string run_id = 1;
  string run_token_id = 2;
  string retry_node_id = 3;
  string execution_token_id = 4;
  string controller_attempt_id = 5;
  string failed_attempt_id = 6;
  string target_node_id = 7;
  string error_code = 8;
  WorkflowRetryDecision decision = 9;
  uint32 next_attempt_number = 10;
  uint32 maximum_attempts = 11;
  uint64 delay_milliseconds = 12;
  int64 eligible_at_unix_millis = 13;
  WorkflowValueReference retry_input = 14;
  WorkflowValueReference error = 15;
  reserved 16 to 25;
}

message WorkflowWaitSignalRecorded {
  string run_id = 1;
  string signal_id = 2;
  string signal_command_id = 3;
  string kind = 4;
  string owner_kind = 5;
  string owner_id = 6;
  repeated WorkflowWaitCorrelation correlation = 7;
  WorkflowValueReference value = 8;
  reserved 9 to 20;
}

message WorkflowWaitSubscribed {
  string run_id = 1;
  string run_token_id = 2;
  string subscription_id = 3;
  string wait_node_id = 4;
  string execution_token_id = 5;
  string controller_attempt_id = 6;
  string workflow_id = 7;
  string revision_id = 8;
  string package_digest = 9;
  string kind = 10;
  string owner_kind = 11;
  string owner_id = 12;
  repeated WorkflowWaitCorrelation correlation = 13;
  string input_value_id = 14;
  string input_sha256 = 15;
  int64 expires_at_unix_millis = 16;
  reserved 17 to 25;
}

enum WorkflowWaitDecision {
  WORKFLOW_WAIT_DECISION_UNSPECIFIED = 0;
  WORKFLOW_WAIT_DECISION_RESUMED = 1;
  WORKFLOW_WAIT_DECISION_EXPIRED = 2;
  WORKFLOW_WAIT_DECISION_CANCELLED = 3;
}

message WorkflowWaitResolved {
  string run_id = 1;
  string run_token_id = 2;
  string subscription_id = 3;
  WorkflowWaitDecision decision = 4;
  string signal_id = 5;
  WorkflowValueReference output = 6;
  string reason_code = 7;
  reserved 8 to 20;
}

// Payload for event kind `workflow.attempt.started`.
message WorkflowAttemptStarted {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  uint32 attempt_number = 5;
  string execution_token_id = 6;
  reserved 7 to 15;
}

message WorkflowCapabilityArtifactHandle {
  string handle_id = 1;
  string role = 2;
  WorkflowValueReference value = 3;
  reserved 4 to 12;
  reserved "host_path", "raw_path", "mount_path";
}

message WorkflowCapabilityLogEntry {
  uint32 sequence = 1;
  string level = 2;
  string message = 3;
  uint64 offset_milliseconds = 4;
  reserved 5 to 12;
}

// The immutable contract admitted before a registered capability is invoked.
// `invocation_id` is also the required host idempotency key.
message WorkflowCapabilityAttemptStarted {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string attempt_id = 4;
  string execution_token_id = 5;
  string node_id = 6;
  string capability_id = 7;
  string version = 8;
  string package_digest = 9;
  string configuration_contract_digest = 10;
  string input_schema_digest = 11;
  string output_schema_digest = 12;
  string output_schema_ref = 13;
  WorkflowValueReference configuration = 14;
  WorkflowValueReference input = 15;
  repeated WorkflowCapabilityArtifactHandle artifact_inputs = 16;
  uint64 timeout_milliseconds = 17;
  int64 deadline_unix_millis = 18;
  reserved 19 to 30;
  reserved "credential", "host_path", "secret";
}

enum WorkflowCapabilityAttemptOutcome {
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_INPUT_VALIDATION_FAILED = 2;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_OUTPUT_VALIDATION_FAILED = 3;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_TIMED_OUT = 4;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_CANCELLED = 5;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_MALFORMED_RESULT = 6;
  WORKFLOW_CAPABILITY_ATTEMPT_OUTCOME_CRASHED = 7;
}

message WorkflowCapabilityAttemptSettled {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string attempt_id = 4;
  WorkflowCapabilityAttemptOutcome outcome = 5;
  WorkflowValueReference output = 6;
  repeated WorkflowCapabilityArtifactHandle artifact_outputs = 7;
  string error_code = 8;
  WorkflowValueReference error = 9;
  repeated WorkflowCapabilityLogEntry logs = 10;
  uint64 elapsed_milliseconds = 11;
  string receipt_id = 12;
  string provider_run_reference = 13;
  string idempotency_key = 14;
  reserved 15 to 25;
  reserved "credential", "host_path", "secret";
}

message WorkflowLlmModelSettings {
  string model_class = 1;
  string provider_id = 2;
  string model_id = 3;
  string model_revision = 4;
  string reasoning_effort = 5;
  uint32 temperature_milli = 6;
  uint64 maximum_context_bytes = 7;
  uint32 maximum_output_tokens = 8;
  string conversation_scope = 9;
  reserved 10 to 20;
  reserved "credential", "api_key", "endpoint";
}

message WorkflowLlmContextGroup {
  string group_id = 1;
  string kind = 2;
  string title = 3;
  string provenance = 4;
  WorkflowValueReference content = 5;
  uint64 original_byte_count = 6;
  uint64 retained_byte_count = 7;
  uint32 redaction_count = 8;
  bool truncated = 9;
  repeated string source_episode_ids = 10;
  reserved 11 to 20;
  reserved "host_path", "raw_path", "secret";
}

message WorkflowLlmMessage {
  string message_id = 1;
  uint32 sequence = 2;
  string role = 3;
  string context_group_id = 4;
  string summary = 5;
  string content_value_id = 6;
  uint64 estimated_tokens = 7;
  uint32 redaction_count = 8;
  bool truncated = 9;
  reserved 10 to 20;
}

message WorkflowLlmCompilationReport {
  uint32 original_group_count = 1;
  uint32 retained_group_count = 2;
  uint64 original_byte_count = 3;
  uint64 retained_byte_count = 4;
  uint32 redaction_count = 5;
  repeated string truncated_group_ids = 6;
  repeated string dropped_group_ids = 7;
  repeated string redaction_reasons = 8;
  reserved 9 to 20;
}

message WorkflowLlmToolDefinition {
  string tool_id = 1;
  string version = 2;
  string package_digest = 3;
  string description = 4;
  string input_schema_ref = 5;
  string input_schema_digest = 6;
  string output_schema_ref = 7;
  string output_schema_digest = 8;
  reserved 9 to 20;
  reserved "credential", "api_key", "endpoint", "host_path", "secret";
}

message WorkflowLlmToolCall {
  string call_id = 1;
  uint32 sequence = 2;
  string tool_id = 3;
  string status = 4;
  WorkflowValueReference input = 5;
  WorkflowValueReference output = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  uint64 duration_milliseconds = 9;
  reserved 10 to 20;
}

message WorkflowLlmResponseMessage {
  string message_id = 1;
  uint32 sequence = 2;
  string role = 3;
  string kind = 4;
  string summary = 5;
  WorkflowValueReference content = 6;
  string tool_call_id = 7;
  reserved 8 to 20;
}

message WorkflowLlmUsage {
  uint64 input_tokens = 1;
  uint64 cached_input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 reasoning_tokens = 4;
  uint64 total_tokens = 5;
  uint32 tool_call_count = 6;
  string cost_currency = 7;
  uint64 input_cost_micros = 8;
  uint64 output_cost_micros = 9;
  uint64 reasoning_cost_micros = 10;
  uint64 tool_cost_micros = 11;
  uint64 total_cost_micros = 12;
  reserved 13 to 25;
}

message WorkflowLlmResponseValidation {
  string status = 1;
  string schema_ref = 2;
  string schema_digest = 3;
  repeated string diagnostics = 4;
  bool diagnostics_truncated = 5;
  reserved 6 to 15;
}

message WorkflowLlmProviderReceipt {
  string request_id = 1;
  string response_id = 2;
  string receipt_id = 3;
  string provider_run_reference = 4;
  string metadata_digest = 5;
  reserved 6 to 15;
  reserved "credential", "api_key", "endpoint", "host_path", "secret";
}

enum WorkflowLlmAttemptOutcome {
  WORKFLOW_LLM_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_OUTPUT_VALIDATION_FAILED = 2;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_TIMED_OUT = 3;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_CANCELLED = 4;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_MALFORMED_RESULT = 5;
  WORKFLOW_LLM_ATTEMPT_OUTCOME_CRASHED = 6;
}

// The exact bounded context and pinned tool definitions admitted before an
// idempotent model invocation. This message never contains credentials,
// endpoints, or host paths.
message WorkflowLlmAttemptStarted {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string attempt_id = 4;
  string execution_token_id = 5;
  string node_id = 6;
  WorkflowLlmModelSettings settings = 7;
  string context_digest = 8;
  repeated WorkflowLlmContextGroup context_groups = 9;
  repeated WorkflowLlmMessage messages = 10;
  repeated string prior_episode_ids = 11;
  repeated WorkflowCapabilityArtifactHandle attachments = 12;
  WorkflowLlmCompilationReport compilation_report = 13;
  string output_schema_ref = 14;
  string output_schema_digest = 15;
  WorkflowValueReference input = 16;
  uint64 timeout_milliseconds = 17;
  int64 deadline_unix_millis = 18;
  repeated WorkflowLlmToolDefinition tool_definitions = 19;
  reserved 20 to 30;
  reserved "credential", "api_key", "endpoint", "host_path", "secret";
}

message WorkflowLlmAttemptSettled {
  string run_id = 1;
  string run_token_id = 2;
  string invocation_id = 3;
  string attempt_id = 4;
  WorkflowLlmAttemptOutcome outcome = 5;
  WorkflowValueReference output = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  uint64 elapsed_milliseconds = 9;
  string receipt_id = 10;
  string provider_run_reference = 11;
  string idempotency_key = 12;
  repeated WorkflowLlmToolCall tool_calls = 13;
  repeated WorkflowLlmResponseMessage response_messages = 14;
  WorkflowLlmUsage usage = 15;
  WorkflowLlmResponseValidation validation = 16;
  WorkflowLlmProviderReceipt provider_receipt = 17;
  reserved 18 to 25;
  reserved "credential", "api_key", "endpoint", "host_path", "secret";
}

// Immutable description of one proposed external effect. Account binding and
// destination identities are installation-private fingerprints; portable
// workflow packages cannot contain this message or a live authority grant.
message WorkflowEffectIntent {
  string effect_id = 1;
  string run_id = 2;
  string run_token_id = 3;
  string attempt_id = 4;
  string execution_token_id = 5;
  string node_id = 6;
  string workflow_id = 7;
  string revision_id = 8;
  string connector_class = 9;
  string action = 10;
  string account_binding_id = 11;
  string destination_fingerprint = 12;
  string input_digest = 13;
  string idempotency_key = 14;
  reserved 15 to 25;
  reserved "credential", "access_token", "recipient_address", "raw_destination";
}

message WorkflowEffectPreview {
  string summary = 1;
  string consequence = 2;
  bool reversible = 3;
  string destination_fingerprint = 4;
  string preview_digest = 5;
  reserved 6 to 15;
  reserved "raw_body", "recipient_address", "credential";
}

// Payload for event kind `workflow.effect.proposed`. The embedded approval is
// a proposal only and carries no authority until a matching authorization
// event is durably admitted.
message WorkflowEffectProposed {
  WorkflowEffectIntent intent = 1;
  string intent_digest = 2;
  WorkflowEffectPreview preview = 3;
  ApprovalRequest approval_request = 4;
  reserved 5 to 15;
}

// Payload for event kind `workflow.effect.authorized`. This is an exact,
// expiring local grant; it is not provider execution or an effect receipt.
message WorkflowEffectAuthorized {
  string run_id = 1;
  string run_token_id = 2;
  string effect_id = 3;
  string grant_id = 4;
  ApprovalResolution resolution = 5;
  bytes approval_fingerprint = 6;
  string intent_digest = 7;
  string preview_digest = 8;
  string destination_fingerprint = 9;
  string idempotency_key = 10;
  int64 expires_at_unix_millis = 11;
  reserved 12 to 20;
  reserved "credential", "access_token", "recipient_address", "raw_destination";
}

enum WorkflowAttemptOutcome {
  WORKFLOW_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_ATTEMPT_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_ATTEMPT_OUTCOME_FAILED = 2;
  WORKFLOW_ATTEMPT_OUTCOME_CANCELLED = 3;
}

// Payload for event kind `workflow.attempt.settled`.
message WorkflowAttemptSettled {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  uint32 attempt_number = 5;
  WorkflowAttemptOutcome outcome = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  repeated string emission_ids = 9;
  string execution_token_id = 10;
  reserved 11 to 20;
}

// Payload for event kind `workflow.port.emitted`.
message WorkflowPortEmitted {
  string run_id = 1;
  string run_token_id = 2;
  string emission_id = 3;
  string attempt_id = 4;
  string node_id = 5;
  string port_id = 6;
  WorkflowValueReference value = 7;
  string execution_token_id = 8;
  reserved 9 to 20;
}

enum WorkflowEdgeCheckpointState {
  WORKFLOW_EDGE_CHECKPOINT_STATE_UNSPECIFIED = 0;
  WORKFLOW_EDGE_CHECKPOINT_STATE_ADMITTED = 1;
  WORKFLOW_EDGE_CHECKPOINT_STATE_SKIPPED = 2;
}

// Payload for event kind `workflow.edge.checkpointed`.
message WorkflowEdgeCheckpointed {
  string run_id = 1;
  string run_token_id = 2;
  string edge_id = 3;
  string emission_id = 4;
  string target_node_id = 5;
  string target_port_id = 6;
  WorkflowEdgeCheckpointState state = 7;
  string execution_token_id = 8;
  reserved 9 to 20;
}

// Payload for event kind `workflow.match.trace-recorded`.
message WorkflowMatchTraceRecorded {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  string input_value_id = 5;
  repeated string evaluated_case_ids = 6;
  repeated string matched_case_ids = 7;
  repeated string emitted_port_ids = 8;
  WorkflowValueReference trace = 9;
  string execution_token_id = 10;
  reserved 11 to 20;
}

// Payload for event kind `workflow.run.cancellation-requested`.
message WorkflowRunCancellationRequested {
  string run_id = 1;
  string run_token_id = 2;
  string cancel_command_id = 3;
  string reason_code = 4;
