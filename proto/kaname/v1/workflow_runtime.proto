syntax = "proto3";

package kaname.v1;

import "kaname/v1/common.proto";

// A value recorded directly in the bounded journal or represented by an
// opaque storage reference. Host paths and secret material are never valid
// references.
message WorkflowValueReference {
  string value_id = 1;
  string content_type = 2;
  uint64 byte_count = 3;
  string sha256 = 4;
  bytes inline_canonical_json = 5;
  string storage_reference_id = 6;
  reserved 7 to 15;
  WorkflowStorageValueMetadata storage = 16;
  reserved "host_path", "raw_path", "secret";
}

// Inspectable lineage for a scoped value. The handle is opaque and never a
// host path; byte access remains mediated by the storage service.
message WorkflowStorageValueMetadata {
  string handle_id = 1;
  string scope = 2;
  string logical_key = 3;
  string version_id = 4;
  uint64 revision = 5;
  string previous_version_id = 6;
  uint64 byte_count = 7;
  string result = 8;
  reserved 9 to 20;
  reserved "host_path", "raw_path", "cas_path", "mount_path";
}

message WorkflowInputBinding {
  string port_id = 1;
  WorkflowValueReference value = 2;
  reserved 3 to 10;
}

// Payload for command kind `workflow.run.request`.
message RequestWorkflowRun {
  string run_id = 1;
  string workflow_id = 2;
  string revision_id = 3;
  string package_digest = 4;
  string trigger_kind = 5;
  string trigger_event_id = 6;
  repeated WorkflowInputBinding inputs = 7;
  reserved 8 to 20;
  string installation_id = 21;
  string case_id = 22;
  reserved 23 to 30;
  reserved "workflow_path", "database_path", "credential";
}

// Payload for command kind `workflow.run.cancel`.
message CancelWorkflowRun {
  string run_id = 1;
  string run_token_id = 2;
  string reason_code = 3;
  reserved 4 to 15;
}

// Payload for event kind `workflow.run.token-created`.
message WorkflowRunTokenCreated {
  string run_id = 1;
  string run_token_id = 2;
  string request_command_id = 3;
  string workflow_id = 4;
  string revision_id = 5;
  string package_digest = 6;
  reserved 7 to 20;
}

// Payload for event kind `workflow.attempt.started`.
message WorkflowAttemptStarted {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  uint32 attempt_number = 5;
  reserved 6 to 15;
}

enum WorkflowAttemptOutcome {
  WORKFLOW_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_ATTEMPT_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_ATTEMPT_OUTCOME_FAILED = 2;
  WORKFLOW_ATTEMPT_OUTCOME_CANCELLED = 3;
}

// Payload for event kind `workflow.attempt.settled`.
message WorkflowAttemptSettled {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  uint32 attempt_number = 5;
  WorkflowAttemptOutcome outcome = 6;
  string error_code = 7;
  WorkflowValueReference error = 8;
  repeated string emission_ids = 9;
  reserved 10 to 20;
}

// Payload for event kind `workflow.port.emitted`.
message WorkflowPortEmitted {
  string run_id = 1;
  string run_token_id = 2;
  string emission_id = 3;
  string attempt_id = 4;
  string node_id = 5;
  string port_id = 6;
  WorkflowValueReference value = 7;
  reserved 8 to 20;
}

enum WorkflowEdgeCheckpointState {
  WORKFLOW_EDGE_CHECKPOINT_STATE_UNSPECIFIED = 0;
  WORKFLOW_EDGE_CHECKPOINT_STATE_ADMITTED = 1;
  WORKFLOW_EDGE_CHECKPOINT_STATE_SKIPPED = 2;
}

// Payload for event kind `workflow.edge.checkpointed`.
message WorkflowEdgeCheckpointed {
  string run_id = 1;
  string run_token_id = 2;
  string edge_id = 3;
  string emission_id = 4;
  string target_node_id = 5;
  string target_port_id = 6;
  WorkflowEdgeCheckpointState state = 7;
  reserved 8 to 20;
}

// Payload for event kind `workflow.match.trace-recorded`.
message WorkflowMatchTraceRecorded {
  string run_id = 1;
  string run_token_id = 2;
  string attempt_id = 3;
  string node_id = 4;
  string input_value_id = 5;
  repeated string evaluated_case_ids = 6;
  repeated string matched_case_ids = 7;
  repeated string emitted_port_ids = 8;
  WorkflowValueReference trace = 9;
  reserved 10 to 20;
}

// Payload for event kind `workflow.run.cancellation-requested`.
message WorkflowRunCancellationRequested {
  string run_id = 1;
  string run_token_id = 2;
  string cancel_command_id = 3;
  string reason_code = 4;
  reserved 5 to 15;
}

enum WorkflowRunOutcome {
  WORKFLOW_RUN_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_RUN_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_RUN_OUTCOME_FAILED = 2;
  WORKFLOW_RUN_OUTCOME_CANCELLED = 3;
}

// Payload for event kind `workflow.run.settled`.
message WorkflowRunSettled {
  string run_id = 1;
  string run_token_id = 2;
  WorkflowRunOutcome outcome = 3;
  string error_code = 4;
  WorkflowValueReference error = 5;
  repeated string final_emission_ids = 6;
  reserved 7 to 20;
}

// Bounded, read-only query over the disposable run projection. The journal
// remains authoritative; callers never supply a database or host path.
message WorkflowRunInspectionQuery {
  SchemaVersion schema_version = 1;
  string request_id = 2;
  string workflow_id = 3;
  string run_id = 4;
  uint32 limit = 5;
  reserved 6 to 15;
  reserved "database_path", "journal_path", "raw_path";
}

message WorkflowProjectedValue {
  string value_id = 1;
  string content_type = 2;
  uint64 byte_count = 3;
  string sha256 = 4;
  bytes inline_canonical_json = 5;
  string storage_reference_id = 6;
  string availability = 7;
  reserved 8 to 15;
  WorkflowStorageValueMetadata storage = 16;
}

message WorkflowProjectedAttempt {
  string attempt_id = 1;
  string node_id = 2;
  uint32 attempt_number = 3;
  string status = 4;
  string outcome = 5;
  string error_code = 6;
  WorkflowProjectedValue error = 7;
  int64 started_at_unix_millis = 8;
  int64 settled_at_unix_millis = 9;
  uint64 started_store_position = 10;
  uint64 settled_store_position = 11;
  repeated string emission_ids = 12;
  reserved 13 to 20;
}

message WorkflowProjectedNodeState {
  string node_id = 1;
  string status = 2;
  string latest_attempt_id = 3;
  uint32 latest_attempt_number = 4;
  int64 started_at_unix_millis = 5;
  int64 settled_at_unix_millis = 6;
  uint64 last_store_position = 7;
  reserved 8 to 15;
}

message WorkflowProjectedEmission {
  string emission_id = 1;
  string attempt_id = 2;
  string node_id = 3;
  string port_id = 4;
  WorkflowProjectedValue value = 5;
  string event_id = 6;
  int64 emitted_at_unix_millis = 7;
  uint64 store_position = 8;
  reserved 9 to 15;
}

message WorkflowProjectedEdgeCheckpoint {
  string event_id = 1;
  string edge_id = 2;
  string emission_id = 3;
  string target_node_id = 4;
  string target_port_id = 5;
  string state = 6;
  int64 checkpointed_at_unix_millis = 7;
  uint64 store_position = 8;
  reserved 9 to 15;
}

message WorkflowProjectedMatchTrace {
  string event_id = 1;
  string attempt_id = 2;
  string node_id = 3;
  string input_value_id = 4;
  repeated string evaluated_case_ids = 5;
  repeated string matched_case_ids = 6;
  repeated string emitted_port_ids = 7;
  WorkflowProjectedValue trace = 8;
  int64 recorded_at_unix_millis = 9;
  uint64 store_position = 10;
  reserved 11 to 20;
}

message WorkflowProjectedEventReference {
  string event_id = 1;
  string kind = 2;
  uint64 store_position = 3;
  uint64 stream_sequence = 4;
  int64 occurred_at_unix_millis = 5;
  reserved 6 to 12;
}

message WorkflowProjectedRun {
  string run_id = 1;
  string run_token_id = 2;
  string request_command_id = 3;
  string workflow_id = 4;
  string revision_id = 5;
  string package_digest = 6;
  string status = 7;
  string outcome = 8;
  string error_code = 9;
  WorkflowProjectedValue error = 10;
  repeated string final_emission_ids = 11;
  string cancellation_command_id = 12;
  string cancellation_reason_code = 13;
  int64 created_at_unix_millis = 14;
  int64 settled_at_unix_millis = 15;
  uint64 first_store_position = 16;
  uint64 last_store_position = 17;
  repeated WorkflowProjectedAttempt attempts = 18;
  repeated WorkflowProjectedNodeState nodes = 19;
  repeated WorkflowProjectedEmission emissions = 20;
  repeated WorkflowProjectedEdgeCheckpoint edges = 21;
  repeated WorkflowProjectedMatchTrace match_traces = 22;
  repeated WorkflowProjectedEventReference events = 23;
  reserved 24 to 35;
}

message WorkflowRunInspectionResponse {
  SchemaVersion schema_version = 1;
  string request_id = 2;
  uint64 projection_high_water_mark = 3;
  repeated WorkflowProjectedRun runs = 4;
  string absence_reason = 5;
  reserved 6 to 15;
}
