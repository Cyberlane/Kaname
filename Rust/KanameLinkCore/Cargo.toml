[package]
name = "kaname_link_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kaname_link_core"
path = "src/lib.rs"

[[bin]]
name = "kaname-link-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "kaname-link-client"
path = "src/bin/client.rs"

[dependencies]
axum = "=0.8.9"
base64 = "=0.23.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
keyring = "=4.1.6"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
snow = "=0.10.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "=1.25.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
