[package]
name = "kaname_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kaname_core"
path = "src/lib.rs"

[[bin]]
name = "kaname-protocol-fixture-tool"
path = "src/bin/fixture_tool.rs"

[[bin]]
name = "kaname-local-core"
path = "src/bin/local_core.rs"

[[bin]]
name = "kaname-phase1-measure"
path = "src/bin/phase1_measure.rs"

[dependencies]
prost = "=0.14.4"
hex = "=0.4.3"
jsonschema = { version = "=0.49.9", default-features = false }
rusqlite = { version = "=0.40.1", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
